<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizSim diagnosa</title></head>
<body style="font:14px/1.5 system-ui,sans-serif;padding:16px;color:#102033"><h3>BizSim diagnosa</h3><p>Halaman ini tidak memakai file lain. Tunggu sampai muncul "Selesai", lalu kirim seluruh teks di bawah.</p><pre id="o" style="white-space:pre-wrap;word-break:break-word;background:#f1f5f9;padding:12px;border-radius:10px">Memeriksa...</pre>
<script>
(async function(){var o=document.getElementById('o'),L=[];function add(s){L.push(s);o.textContent=L.join('\n');}
add('Waktu: '+new Date().toISOString());add('URL: '+location.href);add('Browser: '+navigator.userAgent);add('IndexedDB: '+(typeof indexedDB!=='undefined'?'ada':'TIDAK ada'));
var files=['ping.txt','index.html','app.css','app.js','local-api.js','engine/api.js','engine/shim/blobs.js','engine/shim/node-crypto.js','v720-life.js'];
for(var k=0;k<files.length;k++){var f=files[k],t=performance.now();try{var r=await fetch(f,{cache:'no-store'}),b=await r.text(),ct=r.headers.get('content-type')||'',html=/^\s*<(!doctype|html)/i.test(b)&&!/\.html$/.test(f);add((r.ok&&!html?'OK    ':'GAGAL ')+f+'  status '+r.status+'  '+ct+'  '+b.length+' byte  '+Math.round(performance.now()-t)+' ms'+(html?'  <- isinya HTML, bukan file yang diminta (folder deploy salah)':''));}catch(e){add('GAGAL '+f+'  '+e.message);}}
try{var m=await import(new URL('engine/api.js',location.href).href);add('Mesin lokal: dimuat ('+typeof m.default+')');}catch(e){add('Mesin lokal: GAGAL '+e.message);}
add('Selesai.');})();
</script></body></html>
